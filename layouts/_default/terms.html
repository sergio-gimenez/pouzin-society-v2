{{ define "main" }}
  <section class="listing-section">
    <div class="section-heading">
      <p class="eyebrow">Categories</p>
      <h1>{{ .Title }}</h1>
    </div>
    <div class="card-grid">
      {{ range .Data.Terms.Alphabetical }}
        <article class="card panel">
          <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></h2>
          <p>{{ .Count }} posts</p>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
