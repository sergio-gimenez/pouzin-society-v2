<article class="card panel post-card">
  {{ with .Params.featured_image }}
    <a class="card-image" href="{{ $.RelPermalink }}">
      <img src="{{ strings.TrimPrefix "/" . | absURL }}" alt="{{ $.Title }}">
    </a>
  {{ end }}
  <div class="card-body">
    <div class="card-meta-row">
      <p class="eyebrow">{{ with .Date }}{{ .Format "Jan 2, 2006" }}{{ end }}</p>
      {{ with .Params.categories }}<span class="card-tag">{{ index . 0 }}</span>{{ end }}
    </div>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 220 }}{{ end }}</p>
    <a class="card-cta" href="{{ .RelPermalink }}">Read article</a>
  </div>
</article>
