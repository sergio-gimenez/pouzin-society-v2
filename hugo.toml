[params]
description = 'Static rebuild of the Pouzin Society website focused on RINA education, research, implementations, and community updates.'
tagline = 'Taking network protocol architecture to the next level'
logo = '/mirror/pouzinsociety.org/wp-content/uploads/2023/10/psoc_logo_75-1.png'

[[params.hero]]
title = 'Meet RINA'
text = 'Discover the potential of the Recursive InterNetwork Architecture (RINA) to build simpler and more powerful computer networks.'
image = '/mirror/pouzinsociety.org/wp-content/uploads/2023/10/slide-image-1.jpg'

[[params.hero]]
title = 'Participate'
text = 'Join the global team of academic and industry researchers that are developing the RINA technology.'
image = '/mirror/pouzinsociety.org/wp-content/uploads/2023/10/slide-image-2.jpg'

[[params.hero]]
title = 'Stay Connected'
text = 'Enjoy the latest updates of the RINA research and development community: events, publications, and prototype software releases.'
image = '/mirror/pouzinsociety.org/wp-content/uploads/2023/10/slide-image-3.jpg'

